# Database Configuration Mysql (local)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Database Configuration PostgreSQL (remoto)
#spring.datasource.url=${PG_URL}
#spring.datasource.username=${PG_USERNAME}
#spring.datasource.password=${PG_PASSWORD}
#spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
    spring.jpa.defer-datasource-initialization=true

# Server Configuration
server.port=8080

# File Upload
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB

#Configuracion SSL-HTTPS
#server.port=8443
#server.ssl.key-store=${SERVER_SSL_KEY_STORE}
#server.ssl.key-store-password=${SERVER_SSL_KEY_STORE_PASSWORD}
#server.ssl.key-store-type=${SERVER_SSL_KEY_STORE_TYPE}
#server.ssl.key-alias=${SERVER_SSL_KEY_ALIAS}

# JWT
jwt.secret=${JWT_SECRET}
wevently.app.jwtExpirationMs=86400000

#Credenciales mercado pago
mercadopago.acces-token=${MERCADOPAGO_ACCESS_TOKEN}
#mercadopago.access-token=${MERCADOPAGO_PROD_ACCESS_TOKEN}

# Zoho Mail OAuth
zoho.mail.refresh-token=${ZOHO_MAIL_REFRESH_TOKEN}
zoho.mail.client-id=${ZOHO_MAIL_CLIENT_ID}
zoho.mail.client-secret=${ZOHO_MAIL_CLIENT_SECRET}
zoho.mail.redirect-uri=${ZOHO_MAIL_REDIRECT_URI}
zoho.mail.account-email=${ZOHO_MAIL_ACCOUNT_EMAIL}